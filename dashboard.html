<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Choir — Staff Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* 스캐너와 동일한 라이트 테마 */
  --bg:        #f5f0eb;
  --surface:   #ffffff;
  --surface2:  #fdf8f4;
  --border:    #e8ddd5;
  --border2:   #d5c8bc;
  --red:       #c0392b;
  --red-soft:  rgba(192,57,43,0.10);
  --red-dim:   #9a2d22;
  --red-light: #e85d4a;
  --green:     #27ae60;
  --green-soft:rgba(39,174,96,0.10);
  --blue:      #2471a3;
  --blue-soft: rgba(36,113,163,0.10);
  --amber:     #d68910;
  --amber-soft:rgba(214,137,16,0.10);
  --err:       #c0392b;
  --err-soft:  rgba(192,57,43,0.10);
  --text:      #1a0e08;
  --text2:     #5a3e30;
  --text3:     #8a6a58;
  --text4:     #b8a090;
  --r:         14px;
  --tap:       44px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;color-scheme:light;}

/* ── TOP BAR ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;           /* 좁은 화면에서 두 줄로 */
  gap: 8px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo {
  width: 40px; height: 40px;
  background: var(--red);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(192,57,43,0.30);
}
.site-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: var(--red); white-space: nowrap; }
.season-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text4); background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.last-update { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; }
.refresh-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 8px 16px;
  color: var(--text2);
  font-size: 13px; font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background .2s, color .2s;
  white-space: nowrap;
  min-height: var(--tap);
  display: inline-flex; align-items: center;
}
.refresh-btn:hover { background: var(--border); color: var(--text); }
.scanner-link {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 99px;
  padding: 8px 16px;
  font-size: 13px; font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  text-decoration: none;
  transition: opacity .15s;
  white-space: nowrap;
  min-height: var(--tap);
  display: inline-flex; align-items: center;
  box-shadow: 0 2px 8px rgba(192,57,43,0.25);
}
.scanner-link:hover { opacity: .88; }

/* 좁은 화면: topbar-right가 두 번째 줄 전체를 차지 */
@media (max-width: 600px) {
  .topbar { padding: 10px 16px; }
  .topbar-right { width: 100%; justify-content: flex-end; }
  .season-tag  { display: none; }   /* 시즌 태그 숨김 */
  .last-update { font-size: 10px; } /* 타임스탬프는 작게 유지 */
}

/* ── SETUP ── */
.setup-overlay{position:fixed;inset:0;z-index:200;background:rgba(245,240,235,0.95);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;}
.setup-box{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.12);}
.setup-box h2{font-family:'Cormorant Garamond','Playfair Display',serif;font-size:24px;color:var(--red);margin-bottom:10px;letter-spacing:0.02em;}
.setup-box p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px;}
.setup-input{width:100%;padding:12px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'JetBrains Mono',monospace;outline:none;margin-bottom:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.06);}
.setup-btn{width:100%;padding:13px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;}

/* ── PAGE ── */
.page{max-width:1280px;margin:0 auto;padding:26px 22px 52px;}

/* ── SECTION ── */
.sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

.kpi{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;}
.kpi.kred::after  {background:var(--red);}
.kpi.kgreen::after{background:var(--green);}
.kpi.kblue::after {background:var(--blue);}
.kpi.kamber::after{background:var(--amber);}
.kpi.kerr::after  {background:var(--err);}

.kpi-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.kpi-val{font-family:'Cormorant Garamond','Playfair Display',serif;font-size:38px;font-weight:700;line-height:1;margin-bottom:3px;}
.kpi.kred  .kpi-val{color:var(--red);}
.kpi.kgreen.kpi-val,.kpi.kgreen .kpi-val{color:var(--green);}
.kpi.kblue .kpi-val{color:var(--blue);}
.kpi.kamber.kpi-val,.kpi.kamber .kpi-val{color:var(--amber);}
.kpi.kerr  .kpi-val{color:var(--err);}
.kpi-sub{font-size:12px;color:var(--text2);}

/* ── CONCERT GRID ── */
.concert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px;}
@media(max-width:720px){.concert-grid{grid-template-columns:1fr;}}

.cc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;position:relative;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.cc.active{border-color:var(--red);background:linear-gradient(135deg,var(--surface) 80%,rgba(192,57,43,.05));box-shadow:0 2px 12px rgba(192,57,43,0.10);}
.active-pill{position:absolute;top:14px;right:14px;background:var(--red-soft);border:1px solid var(--red);color:var(--red);font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:99px;}
.cc-name{font-family:'Cormorant Garamond','Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:3px;padding-right:64px;letter-spacing:0.01em;}
.cc-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:16px;}

.prog-wrap{margin-bottom:14px;}
.prog-hd{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);font-weight:500;margin-bottom:7px;}
.prog-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--red-dim),var(--red-light));border-radius:99px;transition:width .6s ease;min-width:3px;}

.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ms{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;text-align:center;}
.ms-n{font-family:'Cormorant Garamond','Playfair Display',serif;font-size:24px;font-weight:700;line-height:1;margin-bottom:3px;}
.ms-n.g{color:var(--green);} .ms-n.r{color:var(--red);} .ms-n.m{color:var(--text2);}
.ms-l{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}

.type-list{display:flex;flex-direction:column;gap:7px;}
.type-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.type-name{width:88px;color:var(--text2);flex-shrink:0;font-size:13px;}
.type-bg{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.type-fill{height:100%;border-radius:99px;background:var(--blue);transition:width .5s ease;}
.type-ct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);width:28px;text-align:right;flex-shrink:0;}
.type-rev{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);width:54px;text-align:right;flex-shrink:0;}

/* ── TWO-COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px;}
@media(max-width:720px){.two-col{grid-template-columns:1fr;}}

/* ── CARD ── */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.card-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;}

/* ── CHECKINS ── */
.ci-list{display:flex;flex-direction:column;}
.ci-row{display:grid;grid-template-columns:1fr 100px 88px 72px;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--border);font-size:13px;transition:background .15s;}
.ci-row:last-child{border-bottom:none;}
.ci-row:hover{background:var(--surface2);}
.ci-name{font-weight:600;}
.ci-type{color:var(--text2);font-size:12px;}
.ci-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);}
.ci-cid{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);text-align:right;}

/* ── BREAKDOWN ── */
.bd-list{display:flex;flex-direction:column;gap:14px;padding:18px;}
.bd-item{}
.bd-hd{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:6px;}
.bd-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);}
.bd-bg{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.bd-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease;}

/* ── ATTENDEE TABLE ── */
.tbl-search-wrap{padding:13px 18px;border-bottom:1px solid var(--border);}
.tbl-search{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:9px 14px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s, box-shadow .2s;box-shadow:inset 0 1px 3px rgba(0,0,0,0.06);}
.tbl-search:focus{border-color:var(--red);box-shadow:inset 0 1px 3px rgba(0,0,0,0.06),0 0 0 3px var(--red-soft);}
.tbl-search::placeholder{color:var(--text3);}
.tbl-scroll{max-height:440px;overflow-y:auto;}
.att{width:100%;border-collapse:collapse;}
.att th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface2);position:sticky;top:0;}
.att td{padding:10px 18px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.att tr:last-child td{border-bottom:none;}
.att tr:hover td{background:var(--surface2);}

.sb{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;white-space:nowrap;font-weight:500;}
.sb.ACTIVE    {background:var(--green-soft);color:var(--green);}
.sb.CHECKED_IN{background:var(--red-soft);  color:var(--red);}
.sb.CANCELLED {background:var(--err-soft);  color:var(--err);}
.ctag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;}
.empty-td{text-align:center;color:var(--text2);padding:28px!important;}

/* ── SPINNER ── */
.spin-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:32px;color:var(--text2);font-size:14px;}
.spinner{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay" style="display:none;">
  <div class="setup-box">
    <h2>⚙️ Dashboard Setup</h2>
    <p>Paste your Apps Script Web App URL.<br>Saved locally on this device.</p>
    <input type="url" class="setup-input" id="setupInput" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="setup-btn" onclick="saveSetup()">Save & Load Dashboard</button>
  </div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">🎵</div>
    <div>
      <div class="site-title" id="orgName">Staff Dashboard</div>
      <div class="last-update" id="lastUpdate"></div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="refresh-btn" onclick="loadDashboard()">↺ Refresh</button>
    <a class="scanner-link" href="index.html">Scanner</a>
  </div>
</div>

<div class="page" id="mainPage">
  <div class="spin-wrap"><div class="spinner"></div> Loading dashboard…</div>
</div>

<script>
const LS_KEY = 'choir_scanner_url';
let API_URL  = localStorage.getItem(LS_KEY) || '';
let allAttendees = [];

function checkSetup() {
  if (!API_URL) document.getElementById('setupOverlay').style.display = 'flex';
  else loadDashboard();
}
function saveSetup() {
  const v = document.getElementById('setupInput').value.trim();
  if (!v.startsWith('http')) { alert('Please enter a valid URL.'); return; }
  API_URL = v; localStorage.setItem(LS_KEY, v);
  document.getElementById('setupOverlay').style.display = 'none';
  loadDashboard();
}
function resetSetup() { localStorage.removeItem(LS_KEY); API_URL=''; document.getElementById('setupOverlay').style.display='flex'; }

async function apiFetch(action, params={}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
  const res = await fetch(url.toString(), { method:'GET', redirect:'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadDashboard() {
  document.getElementById('mainPage').innerHTML='<div class="spin-wrap"><div class="spinner"></div> Loading…</div>';
  try {
    const data = await apiFetch('dashboard');
    if (!data.success) throw new Error(data.error||'API error');
    render(data);
  } catch(e) {
    document.getElementById('mainPage').innerHTML=
      `<div class="spin-wrap" style="flex-direction:column;color:var(--err);">
         ⚠️ ${e.message}<br><br>
         <div style="display:flex;gap:10px;">
           <button class="refresh-btn" onclick="loadDashboard()">Retry</button>
           <button class="refresh-btn" onclick="resetSetup()">Reset URL</button>
         </div>
       </div>`;
  }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(d) {
  allAttendees = d.attendees || [];
  document.getElementById('orgName').textContent   = d.org || 'Staff Dashboard';
  const seasonTagEl = document.getElementById('seasonTag');
  if (seasonTagEl) seasonTagEl.textContent = d.season || '';
  document.getElementById('lastUpdate').textContent = 'Updated ' + d.generatedAt;
  const g = d.grand;

  document.getElementById('mainPage').innerHTML = `
    <div class="sec-label" style="margin-bottom:12px;">Season Overview</div>
    <div class="kpi-grid">
      <div class="kpi kgreen"><div class="kpi-lbl">Checked In</div><div class="kpi-val" style="color:var(--green)">${g.checkedIn}</div><div class="kpi-sub">${g.percent}% admitted</div></div>
      <div class="kpi kred" ><div class="kpi-lbl">Tickets Sold</div><div class="kpi-val">${g.total}</div><div class="kpi-sub">${g.remaining} not yet in</div></div>
      <div class="kpi kblue"><div class="kpi-lbl">Total Revenue</div><div class="kpi-val" style="color:var(--blue)">$${g.revenue.toLocaleString()}</div><div class="kpi-sub">all concerts</div></div>
      <div class="kpi kerr" ><div class="kpi-lbl">Cancelled</div><div class="kpi-val" style="color:var(--err)">${g.cancelled}</div><div class="kpi-sub">tickets</div></div>
      <div class="kpi kamber"><div class="kpi-lbl">Avg Ticket</div><div class="kpi-val" style="color:var(--amber)">$${g.total>0?(g.revenue/g.total).toFixed(0):'—'}</div><div class="kpi-sub">per ticket</div></div>
    </div>

    <div class="sec-label">By Concert Night</div>
    <div class="concert-grid">${d.concerts.map(c=>concertCard(c)).join('')}</div>

    <div class="two-col">
      <div>
        <div class="sec-label">Recent Check-ins</div>
        <div class="card">
          <div class="ci-list">
            ${d.recentCheckins.length===0
              ? '<div style="padding:24px;text-align:center;color:var(--text2);font-size:13px;">No check-ins yet.</div>'
              : d.recentCheckins.map(r=>`
                  <div class="ci-row">
                    <div class="ci-name">${esc(r.name)}</div>
                    <div class="ci-type">${esc(r.type)}</div>
                    <div class="ci-time">${r.time}</div>
                    <div class="ci-cid">${esc(r.concertId)}</div>
                  </div>`).join('')}
          </div>
        </div>
      </div>
      <div>
        <div class="sec-label">Ticket Type Breakdown</div>
        <div class="card"><div class="bd-list">${typeBreakdown(d.attendees)}</div></div>
      </div>
    </div>

    <div class="sec-label" style="display:flex;justify-content:space-between;">
      <span>All Attendees</span>
      <span style="color:var(--text3)">${allAttendees.length} records</span>
    </div>
    <div class="card">
      <div class="tbl-search-wrap">
        <input type="search" class="tbl-search" id="attSearch"
               placeholder="Search by name, email, ticket ID, concert, or type…"
               oninput="filterAttendees(this.value)">
      </div>
      <div class="tbl-scroll">
        <table class="att">
          <thead><tr>
            <th>Name</th><th>Ticket ID</th><th>Type</th>
            <th>Qty</th><th>Paid</th><th>Concert</th><th>Status</th><th>Checked In</th>
          </tr></thead>
          <tbody id="attBody">${renderRows(allAttendees)}</tbody>
        </table>
      </div>
    </div>
  `;
}

function concertCard(c) {
  const max = c.byType.length>0 ? Math.max(...c.byType.map(t=>t.sold)) : 1;
  return `
    <div class="cc ${c.active?'active':''}">
      ${c.active?'<div class="active-pill">● ACTIVE</div>':''}
      <div class="cc-name">${esc(c.name)}</div>
      <div class="cc-meta">${c.date}${c.time?' · '+c.time:''}</div>
      <div class="prog-wrap">
        <div class="prog-hd"><span>Check-in</span><span>${c.percent}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${Math.max(c.percent,1)}%"></div></div>
      </div>
      <div class="mini-stats">
        <div class="ms"><div class="ms-n g">${c.checkedIn}</div><div class="ms-l">In</div></div>
        <div class="ms"><div class="ms-n r">${c.remaining}</div><div class="ms-l">Pending</div></div>
        <div class="ms"><div class="ms-n m">$${c.revenue.toLocaleString()}</div><div class="ms-l">Revenue</div></div>
      </div>
      ${c.byType.length>0?`
        <div class="type-list">
          ${c.byType.map(t=>`
            <div class="type-row">
              <div class="type-name">${esc(t.type)}</div>
              <div class="type-bg"><div class="type-fill" style="width:${Math.round((t.sold/max)*100)}%"></div></div>
              <div class="type-ct">${t.sold}</div>
              <div class="type-rev">$${t.revenue.toLocaleString()}</div>
            </div>`).join('')}
        </div>`:'<div style="font-size:13px;color:var(--text2)">No ticket data yet.</div>'}
    </div>`;
}

function typeBreakdown(attendees) {
  const map={};
  attendees.forEach(a=>{ if(a.status==='CANCELLED') return;
    if(!map[a.type]) map[a.type]={sold:0,revenue:0};
    map[a.type].sold+=a.qty; map[a.type].revenue+=a.price*a.qty; });
  const rows=Object.entries(map).sort((a,b)=>b[1].sold-a[1].sold);
  if (!rows.length) return '<div style="color:var(--text2);font-size:13px;text-align:center;padding:8px">No data.</div>';
  const max=Math.max(...rows.map(r=>r[1].sold));
  return rows.map(([type,d])=>`
    <div class="bd-item">
      <div class="bd-hd"><span>${esc(type)}</span><span class="bd-sub">${d.sold} tickets · $${d.revenue.toLocaleString()}</span></div>
      <div class="bd-bg"><div class="bd-fill" style="width:${Math.round((d.sold/max)*100)}%"></div></div>
    </div>`).join('');
}

function renderRows(list) {
  if (!list.length) return '<tr><td class="empty-td" colspan="8">No attendees found.</td></tr>';
  return list.map(a=>`
    <tr>
      <td style="font-weight:600;">${esc(a.name)}</td>
      <td><span style="font-family:'JetBrains Mono',monospace;font-size:12px;">${esc(a.ticketId)}</span></td>
      <td style="color:var(--text2);">${esc(a.type)}</td>
      <td style="font-family:'JetBrains Mono',monospace;">${a.qty}</td>
      <td style="font-family:'JetBrains Mono',monospace;">$${a.price}</td>
      <td><span class="ctag">${esc(a.concertId)}</span></td>
      <td><span class="sb ${a.status}">${a.status.replace('_',' ')}</span></td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);">${a.checkinTime||'—'}</td>
    </tr>`).join('');
}

function filterAttendees(q) {
  const t=q.toLowerCase().trim();
  const filtered=t?allAttendees.filter(a=>
    a.name.toLowerCase().includes(t)||
    (a.email||'').toLowerCase().includes(t)||
    a.ticketId.toLowerCase().includes(t)||
    a.concertId.toLowerCase().includes(t)||
    a.type.toLowerCase().includes(t)||
    a.status.toLowerCase().includes(t)
  ):allAttendees;
  document.getElementById('attBody').innerHTML=renderRows(filtered);
}

window.addEventListener('load', checkSetup);
</script>
</body>
</html>
