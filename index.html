<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎵 Door Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

/* ─── RESET & BASE ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #080a0f;
  --surface:    #0f1118;
  --surface2:   #181c27;
  --border:     #1e2235;
  --border2:    #2a2f45;
  --gold:       #e2b44a;
  --gold-soft:  rgba(226,180,74,0.15);
  --gold-dim:   #8a6d2a;
  --green:      #22d97a;
  --green-soft: rgba(34,217,122,0.12);
  --red:        #f04060;
  --red-soft:   rgba(240,64,96,0.12);
  --amber:      #f5a020;
  --amber-soft: rgba(245,160,32,0.12);
  --text:       #e8e4f5;
  --text2:      #8884a8;
  --text3:      #454260;

  /* touch-friendly sizing */
  --tap:   56px;   /* minimum tap target */
  --r:     16px;   /* border radius */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%; height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden; /* prevent scroll; panels scroll internally */
  user-select: none;
  -webkit-user-select: none;
}

/* ─── LAYOUT SHELL ─── */
.shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ─── HEADER ─── */
header {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 42px; height: 42px;
  background: var(--gold);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.brand-name {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800;
  color: var(--gold);
  line-height: 1;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 3px;
}
.header-badge {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 99px;
  padding: 8px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 13px; color: var(--gold);
  cursor: pointer;
  white-space: nowrap;
  min-height: var(--tap);
  display: flex; align-items: center;
}

/* ─── TAB BAR ─── */
nav {
  flex-shrink: 0;
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  letter-spacing: 0.01em;
}
.tab .tab-icon { font-size: 16px; }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); }

/* ─── PANELS ─── */
.panel {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.panel.on { display: flex; }

/* ══════════════════════════════════
   SCAN PANEL
══════════════════════════════════ */
.scan-panel {
  padding: 24px 20px;
  align-items: center;
  gap: 22px;
  padding-bottom: calc(24px + var(--safe-bottom));
}

/* Camera viewfinder */
.viewfinder-wrap {
  position: relative;
  width: 100%;
  max-width: 320px;
}

#reader {
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  background: #000;
  /* html5-qrcode injects its own styles; we override aggressively */
}
/* Override html5-qrcode default styles */
#reader video { border-radius: 18px !important; }
#reader img   { display: none !important; }
#reader * { border: none !important; }

/* Corner SVG overlay — sized to exactly match viewfinder-wrap */
.corners-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* Scan sweep line */
.sweep {
  position: absolute;
  left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 99px;
  z-index: 11;
  pointer-events: none;
  display: none;
}
.sweep.on {
  display: block;
  animation: sweep 2.2s ease-in-out infinite;
}
@keyframes sweep {
  0%   { top: 18%; opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { top: 82%; opacity: 0; }
}

/* Status row under viewfinder */
.scan-status {
  width: 100%;
  max-width: 320px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--text3);
  transition: background 0.3s;
}
.status-dot.active  { background: var(--gold); animation: dotpulse 1.4s ease infinite; }
.status-dot.ok      { background: var(--green); }
.status-dot.fail    { background: var(--red); }
.status-dot.warn    { background: var(--amber); }
@keyframes dotpulse {
  0%,100% { opacity: 1; } 50% { opacity: 0.3; }
}
.status-text {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: var(--text2);
  letter-spacing: 0.06em;
}

/* Start / Stop button */
.scan-btn {
  width: 100%;
  max-width: 320px;
  min-height: var(--tap);
  border-radius: var(--r);
  border: none;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}
.scan-btn:active { transform: scale(0.97); opacity: 0.85; }
.scan-btn.start { background: var(--gold); color: #080a0f; }
.scan-btn.stop  { background: var(--surface2); color: var(--text2); border: 1.5px solid var(--border2); }

/* Result card */
.result-card {
  width: 100%;
  max-width: 320px;
  border-radius: 18px;
  padding: 20px;
  border: 1.5px solid transparent;
  display: none;
  animation: riseUp 0.28s cubic-bezier(.22,.68,0,1.2);
}
.result-card.show { display: block; }
@keyframes riseUp {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.result-card.ok   { background: var(--green-soft); border-color: var(--green); }
.result-card.warn { background: var(--amber-soft); border-color: var(--amber); }
.result-card.fail { background: var(--red-soft);   border-color: var(--red); }

.result-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.result-emoji { font-size: 32px; line-height: 1; flex-shrink: 0; }
.result-headline {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800;
  line-height: 1.15;
}
.result-card.ok   .result-headline { color: var(--green); }
.result-card.warn .result-headline { color: var(--amber); }
.result-card.fail .result-headline { color: var(--red); }

.result-fields { display: flex; flex-direction: column; }
.rfield {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap: 12px;
}
.rfield:last-child { border-bottom: none; }
.rfield-label { font-size: 13px; color: var(--text2); flex-shrink: 0; }
.rfield-value {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  text-align: right;
  word-break: break-all;
}

.dismiss-btn {
  width: 100%; margin-top: 14px;
  min-height: 48px;
  border-radius: 10px;
  border: 1.5px solid var(--border2);
  background: transparent;
  color: var(--text3);
  font-size: 14px;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer;
  transition: background 0.2s;
}
.dismiss-btn:hover, .dismiss-btn:active { background: var(--border2); }

/* Processing bar */
.proc-bar {
  width: 100%; max-width: 320px;
  height: 3px; border-radius: 99px;
  background: var(--border); overflow: hidden; display: none;
}
.proc-bar.on { display: block; }
.proc-fill {
  height: 100%; background: var(--gold); border-radius: 99px;
  animation: proc 1.1s ease-in-out infinite;
}
@keyframes proc {
  0%   { width: 0%;   margin-left: 0%; }
  50%  { width: 55%;  margin-left: 25%; }
  100% { width: 0%;   margin-left: 100%; }
}

/* Full-screen flash feedback */
.flash-overlay {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999; opacity: 0;
}
@keyframes fGreen { 0%{opacity:.28} 100%{opacity:0} }
@keyframes fRed   { 0%{opacity:.32} 100%{opacity:0} }
.flash-overlay.g { background: var(--green); animation: fGreen .5s ease forwards; }
.flash-overlay.r { background: var(--red);   animation: fRed   .5s ease forwards; }

/* ══════════════════════════════════
   SEARCH PANEL
══════════════════════════════════ */
.search-panel {
  padding: 20px;
  gap: 14px;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.search-row { display: flex; gap: 10px; flex-shrink: 0; }
.search-input {
  flex: 1;
  min-height: var(--tap);
  background: var(--surface2);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  padding: 0 18px;
  color: var(--text);
  font-size: 16px;
  font-family: 'Instrument Sans', sans-serif;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--gold-dim); }
.search-input::placeholder { color: var(--text3); }
.search-go-btn {
  min-height: var(--tap);
  padding: 0 20px;
  background: var(--gold);
  color: #080a0f;
  border: none; border-radius: var(--r);
  font-size: 16px; font-weight: 600;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer;
  white-space: nowrap;
}

.search-results {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.attendee-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  transition: border-color 0.3s;
}
.att-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.att-meta {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text3); line-height: 1.5;
}
.att-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }

.badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px; padding: 4px 10px;
  border-radius: 6px; white-space: nowrap;
  letter-spacing: 0.04em;
}
.badge.ACTIVE     { background: var(--green-soft); color: var(--green); }
.badge.CHECKED_IN { background: var(--gold-soft);  color: var(--gold); }
.badge.CANCELLED  { background: var(--red-soft);   color: var(--red); }

.ci-btn {
  min-height: 40px;
  padding: 0 14px;
  background: var(--green);
  color: #080a0f;
  border: none; border-radius: 9px;
  font-size: 14px; font-weight: 600;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer; white-space: nowrap;
}
.ci-btn:disabled { opacity: 0.4; cursor: default; }

.empty-msg {
  text-align: center; padding: 40px 16px;
  color: var(--text3); font-size: 14px; line-height: 1.7;
}

/* ══════════════════════════════════
   STATS PANEL
══════════════════════════════════ */
.stats-panel {
  padding: 20px;
  gap: 14px;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.event-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  flex-shrink: 0;
}
.event-name {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 800;
  color: var(--gold); margin-bottom: 10px;
  letter-spacing: -0.01em;
}
.event-meta {
  font-family: 'DM Mono', monospace;
  font-size: 13px; color: var(--text2);
  margin-bottom: 5px; display: flex; gap: 8px; align-items: center;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex-shrink: 0;
}
.stat-box {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 18px 16px;
  text-align: center;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 44px; font-weight: 800;
  line-height: 1; margin-bottom: 6px;
}
.stat-num.g { color: var(--green); }
.stat-num.o { color: var(--gold); }
.stat-num.m { color: var(--text3); }
.stat-num.r { color: var(--red); }
.stat-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em;
}

.progress-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
  flex-shrink: 0;
}
.prog-header {
  display: flex; justify-content: space-between;
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: var(--text2);
  margin-bottom: 12px;
}
.prog-track {
  height: 10px; background: var(--border);
  border-radius: 99px; overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 99px;
  transition: width 0.7s cubic-bezier(.22,.68,0,1.2);
  min-width: 6px;
}

.refresh-btn {
  min-height: var(--tap);
  width: 100%;
  border-radius: var(--r);
  border: 1.5px solid var(--border2);
  background: transparent;
  color: var(--gold);
  font-size: 15px;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
}
.refresh-btn:active { background: var(--border2); }

/* ─── SHARED SPINNER ─── */
.spin-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 32px 16px;
  color: var(--text3); font-size: 14px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── CONFIG NOTICE ─── */
.config-notice {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
}
.config-box {
  background: var(--surface);
  border: 1.5px solid var(--border2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 360px; width: 100%;
  text-align: center;
}
.config-box h2 {
  font-family: 'Syne', sans-serif;
  font-size: 20px; color: var(--gold);
  margin-bottom: 12px;
}
.config-box p {
  font-size: 14px; color: var(--text2);
  line-height: 1.6; margin-bottom: 18px;
}
.config-input {
  width: 100%; min-height: var(--tap);
  background: var(--surface2);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  padding: 0 16px;
  color: var(--text); font-size: 14px;
  font-family: 'DM Mono', monospace;
  outline: none; margin-bottom: 12px;
  -webkit-appearance: none;
}
.config-save-btn {
  width: 100%; min-height: var(--tap);
  background: var(--gold); color: #080a0f;
  border: none; border-radius: var(--r);
  font-size: 16px; font-weight: 600;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Full-screen flash feedback -->
<div class="flash-overlay" id="flash"></div>

<!-- Apps Script URL config (first run) -->
<div class="config-notice" id="configNotice" style="display:none;">
  <div class="config-box">
    <h2>⚙️ Setup Required</h2>
    <p>Paste your Apps Script Web App URL below.<br>This is saved locally on this device.</p>
    <input type="url" class="config-input" id="configInput"
           placeholder="https://script.google.com/macros/s/…/exec">
    <button class="config-save-btn" onclick="saveConfig()">Save & Continue</button>
  </div>
</div>

<div class="shell">
  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div>
        <div class="brand-name">Door Scanner</div>
        <div class="brand-sub" id="brandSubLine">Staff Only</div>
      </div>
    </div>
    <div class="header-badge" onclick="goTab('stats')" id="liveBadge">📊 Stats</div>
  </header>

  <!-- TAB BAR -->
  <nav>
    <div class="tab on" id="tab-scan"   onclick="goTab('scan')">
      <span class="tab-icon">📷</span> Scan QR
    </div>
    <div class="tab" id="tab-search" onclick="goTab('search')">
      <span class="tab-icon">🔍</span> Search
    </div>
    <div class="tab" id="tab-stats"  onclick="goTab('stats')">
      <span class="tab-icon">📊</span> Stats
    </div>
  </nav>

  <!-- ══ SCAN PANEL ══ -->
  <div class="panel on scan-panel" id="panel-scan">

    <div class="viewfinder-wrap">
      <div id="reader"></div>
      <!-- SVG corner brackets — draws all 4 corners using explicit coordinates,
           completely immune to html5-qrcode DOM injection -->
      <svg class="corners-svg" id="cornerSvg" viewBox="0 0 100 100"
           preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- We use percentage-based userSpace so the SVG scales with the div.
             All corners are drawn with stroke, no fill. -->
        <g fill="none" stroke="#e2b44a" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
          <!-- Top-left -->
          <path d="M 8 20 L 8 8 L 20 8"/>
          <!-- Top-right -->
          <path d="M 80 8 L 92 8 L 92 20"/>
          <!-- Bottom-left -->
          <path d="M 8 80 L 8 92 L 20 92"/>
          <!-- Bottom-right -->
          <path d="M 80 92 L 92 92 L 92 80"/>
        </g>
      </svg>
      <div class="sweep" id="sweep"></div>
    </div>

    <div class="scan-status">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Tap Start to activate camera</div>
    </div>

    <div class="proc-bar" id="procBar"><div class="proc-fill"></div></div>

    <button class="scan-btn start" id="scanBtn" onclick="toggleScan()">
      ▶ Start Camera
    </button>

    <div class="result-card" id="resultCard">
      <div class="result-head">
        <div class="result-emoji" id="rEmoji"></div>
        <div class="result-headline" id="rHeadline"></div>
      </div>
      <div class="result-fields" id="rFields"></div>
      <button class="dismiss-btn" onclick="dismissResult()">↩ Dismiss &amp; scan next</button>
    </div>

  </div>

  <!-- ══ SEARCH PANEL ══ -->
  <div class="panel search-panel" id="panel-search">
    <div class="search-row">
      <input type="search" class="search-input" id="searchInput"
             placeholder="Search by name…"
             autocomplete="off"
             onkeydown="if(event.key==='Enter'){this.blur();doSearch();}">
      <button class="search-go-btn" onclick="doSearch()">Search</button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="empty-msg">Search for a guest to<br>manually check them in.</div>
    </div>
  </div>

  <!-- ══ STATS PANEL ══ -->
  <div class="panel stats-panel" id="panel-stats">
    <div id="statsInner">
      <div class="spin-wrap"><div class="spinner"></div> Loading…</div>
    </div>
    <button class="refresh-btn" onclick="loadStats()">↺ Refresh Stats</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CONFIG — Apps Script URL stored in localStorage
// ════════════════════════════════════════════════════════
const LS_KEY = 'choir_scanner_url';
let APPS_SCRIPT_URL = localStorage.getItem(LS_KEY) || '';

function checkConfig() {
  if (!APPS_SCRIPT_URL) {
    document.getElementById('configNotice').style.display = 'flex';
  }
}
function saveConfig() {
  const val = document.getElementById('configInput').value.trim();
  if (!val.startsWith('http')) { alert('Please enter a valid URL.'); return; }
  APPS_SCRIPT_URL = val;
  localStorage.setItem(LS_KEY, val);
  document.getElementById('configNotice').style.display = 'none';
  loadStats();
}

// ════════════════════════════════════════════════════════
//  API CALLS — fetch to Apps Script with CORS
// ════════════════════════════════════════════════════════
async function api(action, params = {}) {
  const url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);

  // Apps Script redirects to googleusercontent.com — must follow redirects.
  // mode: 'cors' + redirect: 'follow' handles the 302 correctly.
  const res = await fetch(url.toString(), {
    method: 'GET',
    redirect: 'follow',
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ════════════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════════════
function goTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.getElementById('tab-' + name).classList.add('on');
  document.getElementById('panel-' + name).classList.add('on');
  if (name === 'stats') loadStats();
}

// ════════════════════════════════════════════════════════
//  QR SCANNER
// ════════════════════════════════════════════════════════
let qrScanner = null;
let scanning  = false;
let cooldown  = false;

function toggleScan() {
  scanning ? stopScan() : startScan();
}

function startScan() {
  qrScanner = new Html5Qrcode('reader');
  const size = Math.min(window.innerWidth - 40, 280);

  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: size * 0.72, height: size * 0.72 }, aspectRatio: 1.0 },
    onScanSuccess,
    () => {} // suppress intermediate errors
  ).then(() => {
    scanning = true;
    document.getElementById('scanBtn').className = 'scan-btn stop';
    document.getElementById('scanBtn').textContent = '⏹ Stop Camera';
    setStatus('active', 'Scanning — point at ticket QR code');
    document.getElementById('sweep').classList.add('on');
    dismissResult();
  }).catch(err => {
    setStatus('fail', 'Camera error — check permissions');
    alert('Camera error:\n' + err + '\n\nMake sure you allowed camera access.');
  });
}

function stopScan() {
  if (qrScanner && scanning) {
    qrScanner.stop().then(() => {
      scanning = false;
      document.getElementById('scanBtn').className = 'scan-btn start';
      document.getElementById('scanBtn').textContent = '▶ Start Camera';
      document.getElementById('sweep').classList.remove('on');
      setStatus('', 'Tap Start to activate camera');
    });
  }
}

async function onScanSuccess(ticketId) {
  if (cooldown) return;
  cooldown = true;
  if (navigator.vibrate) navigator.vibrate(60);

  setStatus('active', 'Looking up ticket…');
  document.getElementById('procBar').classList.add('on');
  dismissResult(true);

  try {
    const result = await api('lookup', { ticketId });
    document.getElementById('procBar').classList.remove('on');
    showResult(result);
  } catch (e) {
    document.getElementById('procBar').classList.remove('on');
    showResult({ success: false, message: 'Network error: ' + e.message });
  }
  // Re-enable after 3.5 s
  setTimeout(() => { cooldown = false; }, 3500);
}

// ════════════════════════════════════════════════════════
//  RESULT DISPLAY
// ════════════════════════════════════════════════════════
function showResult(r) {
  const card = document.getElementById('resultCard');
  const fields = document.getElementById('rFields');
  fields.innerHTML = '';
  card.className = 'result-card show';

  if (r.success) {
    card.classList.add('ok');
    setRIcon('✅'); setRHead('Welcome! Enjoy the concert!');
    addField(fields, 'Name',        r.name);
    addField(fields, 'Ticket Type', r.ticketType);
    if ((r.quantity || 1) > 1) addField(fields, 'Party Size', r.quantity + ' guests');
    addField(fields, 'Checked in',  r.checkinTime);
    setStatus('ok', 'Admitted ✓');
    flash('g');
    if (navigator.vibrate) navigator.vibrate([90, 40, 90]);

  } else if (r.status === 'ALREADY_CHECKED_IN') {
    card.classList.add('warn');
    setRIcon('⚠️'); setRHead('Already checked in!');
    addField(fields, 'Name',        r.name);
    addField(fields, 'Ticket Type', r.ticketType);
    addField(fields, 'First entry', r.checkinTime);
    setStatus('warn', 'Duplicate — already in');
    flash('r');
    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);

  } else if (r.status === 'CANCELLED') {
    card.classList.add('fail');
    setRIcon('🚫'); setRHead('Ticket is cancelled');
    if (r.name) addField(fields, 'Name', r.name);
    setStatus('fail', 'Cancelled ticket');
    flash('r');
    if (navigator.vibrate) navigator.vibrate(400);

  } else {
    card.classList.add('fail');
    setRIcon('❌'); setRHead(r.message || r.error || 'Ticket not found');
    setStatus('fail', 'Not found');
    flash('r');
    if (navigator.vibrate) navigator.vibrate(300);
  }

  setTimeout(() => {
    if (!scanning) return;
    setStatus('active', 'Scanning — point at ticket QR code');
  }, 4000);
}

function addField(container, label, val) {
  const d = document.createElement('div');
  d.className = 'rfield';
  d.innerHTML = `<span class="rfield-label">${label}</span><span class="rfield-value">${val ?? '—'}</span>`;
  container.appendChild(d);
}

function setRIcon(v)  { document.getElementById('rEmoji').textContent    = v; }
function setRHead(v)  { document.getElementById('rHeadline').textContent = v; }

function dismissResult(silent) {
  document.getElementById('resultCard').className = 'result-card';
  if (!silent && scanning) setStatus('active', 'Scanning — point at ticket QR code');
  if (!silent && !scanning) setStatus('', 'Tap Start to activate camera');
}

function setStatus(type, text) {
  const dot  = document.getElementById('statusDot');
  const txt  = document.getElementById('statusText');
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
}

function flash(type) {
  const el = document.getElementById('flash');
  el.className = 'flash-overlay ' + type;
  setTimeout(() => { el.className = 'flash-overlay'; }, 600);
}

// ════════════════════════════════════════════════════════
//  SEARCH & MANUAL CHECK-IN
// ════════════════════════════════════════════════════════
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const list = document.getElementById('searchResults');
  list.innerHTML = '<div class="spin-wrap"><div class="spinner"></div> Searching…</div>';

  try {
    const data = await api('search', { query: q });
    renderSearch(data, list);
  } catch (e) {
    list.innerHTML = `<div class="empty-msg" style="color:var(--red)">Network error:<br>${e.message}</div>`;
  }
}

function renderSearch(data, list) {
  if (!data.success || !data.results || !data.results.length) {
    list.innerHTML = '<div class="empty-msg">No attendees found.</div>';
    return;
  }
  list.innerHTML = data.results.map(r => `
    <div class="attendee-card" id="ac-${r.ticketId}">
      <div>
        <div class="att-name">${r.name}</div>
        <div class="att-meta">${r.ticketType}<br>${r.ticketId} · qty ${r.quantity || 1}</div>
      </div>
      <div class="att-right">
        <span class="badge ${r.status}">${r.status.replace('_', ' ')}</span>
        ${r.status === 'ACTIVE'
          ? `<button class="ci-btn" onclick="manualCI('${r.ticketId}',this)">Check In</button>`
          : ''}
      </div>
    </div>
  `).join('');
}

async function manualCI(id, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await api('lookup', { ticketId: id });
    const card = document.getElementById('ac-' + id);
    if (res.success) {
      card.style.borderColor = 'var(--green)';
      btn.textContent = '✓ Done';
      btn.style.background = 'var(--gold)';
      card.querySelector('.badge').className = 'badge CHECKED_IN';
      card.querySelector('.badge').textContent = 'CHECKED IN';
    } else {
      btn.textContent = 'Failed';
      btn.style.background = 'var(--red)';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

// ════════════════════════════════════════════════════════
//  STATS
// ════════════════════════════════════════════════════════
async function loadStats() {
  document.getElementById('statsInner').innerHTML =
    '<div class="spin-wrap"><div class="spinner"></div> Loading…</div>';
  try {
    const s = await api('stats');
    renderStats(s);
  } catch (e) {
    document.getElementById('statsInner').innerHTML =
      `<div class="empty-msg" style="color:var(--red)">Error: ${e.message}</div>`;
  }
}

function renderStats(s) {
  if (!s.success) {
    document.getElementById('statsInner').innerHTML =
      `<div class="empty-msg" style="color:var(--red)">${s.error}</div>`;
    return;
  }
  document.getElementById('liveBadge').textContent = `✅ ${s.checkedIn} / ${s.total}`;
  document.getElementById('statsInner').innerHTML = `
    <div class="event-card">
      <div class="event-name">${s.eventName}</div>
      <div class="event-meta">🗓 ${s.eventDate || 'TBD'}</div>
      <div class="event-meta">📍 ${s.venue || 'TBD'}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num g">${s.checkedIn}</div><div class="stat-lbl">Admitted</div></div>
      <div class="stat-box"><div class="stat-num o">${s.remaining}</div><div class="stat-lbl">Not yet in</div></div>
      <div class="stat-box"><div class="stat-num m">${s.total}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-num r">${s.cancelled}</div><div class="stat-lbl">Cancelled</div></div>
    </div>
    <div class="progress-card">
      <div class="prog-header">
        <span>Admittance</span><span>${s.percent}%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" style="width:${Math.max(s.percent, 1)}%"></div>
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  checkConfig();
  if (APPS_SCRIPT_URL) {
    // Load config → show active concert name in header
    api('config').then(cfg => {
      if (cfg && cfg.success && cfg.activeConcert) {
        const c = cfg.activeConcert;
        document.getElementById('brandSubLine').textContent =
          c.eventName + (c.eventDate ? '  ·  ' + c.eventDate : '');
      }
    }).catch(() => {});

    api('stats').then(s => {
      if (s && s.success)
        document.getElementById('liveBadge').textContent = `✅ ${s.checkedIn} / ${s.total}`;
    }).catch(() => {});
  }
});
</script>
